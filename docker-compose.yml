version: "3.9"
# Sovereign AutoPackager — docker-compose
# Usage: docker-compose up --build

services:
  autopackager:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: sovereign-autopackager:latest
    container_name: sovereign-autopackager
    restart: unless-stopped
    ports:
      - "8797:8797"
    environment:
      SBB_TEMPLATE_REGISTRY_URL: ${SBB_TEMPLATE_REGISTRY_URL}
      SBB_GITHUB_TOKEN: ${SBB_GITHUB_TOKEN}
      SBB_OUTPUT_DIR: ${SBB_OUTPUT_DIR}
      SBB_API_KEY: ${SBB_API_KEY:-change-me}
      SBB_N8N_EVENT_BUS_URL: ${SBB_N8N_EVENT_BUS_URL:-http://host.docker.internal:5678/webhook/event-bus}
      SERVICE_PORT: 8797
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./.data:/app/.data:rw
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8797/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - sbb-platform

networks:
  sbb-platform:
    external: true
    name: sbb-platform-network
