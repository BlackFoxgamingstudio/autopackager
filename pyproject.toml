[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-autopackager"
version = "1.0.0"
description = "Meta-developer tooling that automatically wraps raw source code into standardized Python libraries with pyproject.toml, pytest suites, Dockerfiles, and n8n webhook adapters, plus blameless post-mortem templates."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Russell Alan Powers", email = "russell@sovereignbizbox.io"}
]
keywords = ["sovereign", "meta-engineering & devops tooling", "microservice", "n8n", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries"
]
dependencies = []

[project.scripts]
sovereign-autopackager = "src.cli:main"
